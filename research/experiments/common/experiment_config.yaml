# Cấu hình thực nghiệm dùng chung cho toàn bộ notebook `research/experiments/`
# Tham chiếu quy chuẩn: `research/experiments/common/README.md` & `research/experiments/TASK.md`

defaults:
  rules_version: "DEC-020"
  engine_version: "commander_game_engine-dec020"
  games_per_pair: 200
  side_balance: true
  max_turns: 200
  draw_on_max_turns: false
  seed: 2026
  seeds: [2026, 42, 0, 7, 123, 1337, 2024, 2025, 3407, 9999]
  budget_mode: "default"
  budget_modes:
    default:
      move_timeout_ms: null
      strict_timeout: false
      description: "Chế độ A: cấu hình mặc định minh bạch, không ép ngắt thời gian từng nước."
    controlled:
      move_timeout_ms: 1000
      strict_timeout: true
      description: "Chế độ B: ngân sách tính toán kiểm soát (move_timeout_ms = 1000 ms)."
  time_limit:
    move_timeout_ms: 1000
    game_timeout_ms: 1800000
  search_budget:
    max_nodes: 5000
    max_simulations: 200
    max_depth: 3
  metrics:
    - win_rate
    - draw_rate
    - loss_rate
    - score_ratio
    - avg_decision_time_ms
    - p95_decision_time_ms
    - avg_turns
    - termination_reasons
    - nodes_searched
    - simulations_run
  output_location: "research/results"
  wandb_dir: "research/runs"
  allow_overwrite: false

agent_configs:
  random:
    algorithm: "random"
    class_name: "RandomAgent"
    agent_config_id: "random_v1"
    seed: 2026
  rules:
    algorithm: "rule_based"
    class_name: "RuleBasedAgent"
    agent_config_id: "Ruleset_B"
    ruleset_name: "Ruleset_B"
    ruleset_version: "1.0.0"
    enable_check_rule: true
    tie_breaking: "random"
    safe_check_preference: true
    safe_capture_preference: true
    avoid_losing_captures: true
    high_value_threshold: 20
    seed: 2026
  heuristic:
    algorithm: "heuristic"
    class_name: "HeuristicAgent"
    weight_config_id: "default_v1"
    enabled_components:
      - "material"
      - "safety"
      - "attack"
      - "position"
    weights:
      material: 1.0
      safety: 0.35
      attack: 0.25
      position: 0.15
    normalization: "none"
    tie_breaking: "random"
    seed: 2026
  minimax:
    algorithm: "minimax"
    class_name: "MinimaxAgent"
    seed: 2026
    depth: 2
    search_budget:
      max_nodes: 5000
  alphabeta:
    algorithm: "alphabeta"
    class_name: "AlphaBetaAgent"
    seed: 2026
    depth: 3
    move_ordering: true
    search_budget:
      max_nodes: 10000
  mcts:
    algorithm: "mcts"
    class_name: "MCTSAgent"
    seed: 2026
    iterations: 200
    exploration_c: 1.414
    max_rollout_steps: 60

experiments:
  07_test_random_agent:
    experiment_id: "07_test_random_agent"
    description: "Kiểm thử chức năng, tính phân phối đều và baseline đối chứng của RandomAgent."
    agent_a: "random"
    agent_b: "random"
    uniformity_samples: 1000
    wandb_project: "commander-chess-ai"
    wandb_group: "random-agent"

  08_test_rules_agent:
    experiment_id: "08_test_rules_agent"
    description: "Kiểm thử Ruleset A / Ruleset B (RuleBasedAgent) và Ablation Luật 3 đối đầu RandomAgent."
    agent_a: "rules"
    agent_b: "random"
    wandb_project: "commander-chess-ai"
    wandb_group: "rules-agent"

  09_test_heuristic_agent:
    experiment_id: "09_test_heuristic_agent"
    description: "Kiểm thử HeuristicAgent, đánh giá độ nhạy trọng số, Ablation và theo dõi bằng W&B."
    agent_a: "heuristic"
    agent_b: "random"
    secondary_opponent: "rules"
    wandb_project: "commander-chess-ai"
    wandb_group: "heuristic-agent"

  10_test_minimax_agent:
    experiment_id: "10_test_minimax_agent"
    description: "Kiểm thử MinimaxAgent với giới hạn độ sâu và ngân sách tìm kiếm."
    agent_a: "minimax"
    agent_b: "heuristic"
    games_per_pair: 20

  11_test_alphabeta_agent:
    experiment_id: "11_test_alphabeta_agent"
    description: "Kiểm thử AlphaBetaAgent, đo hiệu quả cắt tỉa so với Minimax."
    agent_a: "alphabeta"
    agent_b: "minimax"
    games_per_pair: 20

  12_test_mcts:
    experiment_id: "12_test_mcts"
    description: "Kiểm thử MCTSAgent theo số vòng mô phỏng và hệ số UCB."
    agent_a: "mcts"
    agent_b: "heuristic"
    games_per_pair: 20

  13_compare_agents:
    experiment_id: "13_compare_agents"
    description: "Đấu vòng tròn so sánh toàn diện các tác tử đã hoàn thiện."
    agent_a: "alphabeta"
    agent_b: "mcts"
    agent_roster:
      - "random"
      - "rules"
      - "heuristic"
      - "minimax"
      - "alphabeta"
      - "mcts"
