
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: sqlite:////app/data/commander_chess.db
    ports:
      - "8000:8000"
    volumes:
      - ./data/local:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
